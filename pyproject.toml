[project]
name = "post-training-agent"
version = "0.1.0"
description = "Post-training track agent for Valkyrie"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "model-library>=0.1.39",
]

[dependency-groups]
dev = ["basedpyright>=1.38.0", "pytest", "ruff>=0.14.10"]

[project.scripts]
post-training-agent = "post_training_agent.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/post_training_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportExplicitAny = false
reportAny = false
reportMissingTypeStubs = false

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { certifi = false, model-library = false }
